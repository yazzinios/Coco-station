version: '3.8'

# =============================================================================
# docker-compose.yml — LOCAL DEVELOPMENT
# Usage: docker compose up -d
#
# For production use: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cc_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
      - "1935:1935"     # RTMP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC WHEP
      - "8189:8189/udp" # WebRTC ICE UDP
      - "9997:9997"     # MediaMTX API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes

  db:
    image: postgres:16-alpine
    container_name: cc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coco_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cocostation}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # exposed for local debugging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coco} -d ${POSTGRES_DB:-cocostation}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    container_name: cc_api
    restart: unless-stopped
    ports:
      - "8000:8000"   # exposed locally for debugging / direct curl
    volumes:
      - ./data/library:/app/data/library
      - ./data/announcements:/app/data/announcements
      - ./data/chimes:/app/data/chimes
      - ./data/branding:/app/data/branding
      - ./data/recordings:/recordings
      - ./supabase/migrations:/app/supabase/migrations:ro
      # Uncomment for hot-reload dev (shadows built image — dev only):
      # - ./api:/app
    environment:
      - TZ=Africa/Casablanca
      - DB_MODE=${DB_MODE:-local}
      - POSTGRES_USER=${POSTGRES_USER:-coco}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-coco_secret}
      - POSTGRES_DB=${POSTGRES_DB:-cocostation}
      - POSTGRES_HOST=db
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - FFMPEG_HOST=ffmpeg-mixer
      - MEDIAMTX_HOST=mediamtx
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
      - WS_PING_INTERVAL=30
      - WS_PING_TIMEOUT=20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      ffmpeg-mixer:
        condition: service_started
      redis:
        condition: service_started

  ffmpeg-mixer:
    build: ./ffmpeg-mixer
    container_name: cc_ffmpeg
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - ./data/library:/library:ro
      - ./data/announcements:/announcements:ro
      - ./data/chimes:/chimes:ro
      - ./data/recordings:/recordings
    environment:
      - TZ=Africa/Casablanca
      - MEDIAMTX_HOST=mediamtx
      - API_HOST=api
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_WS_URL=ws://localhost:8000
        - VITE_SUPABASE_URL=${SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    container_name: cc_dashboard
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      - TZ=Africa/Casablanca
    depends_on:
      api:
        condition: service_healthy
