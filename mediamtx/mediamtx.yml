###############################################
# Global settings
api: yes
apiAddress: :9997

###############################################
# RTSP
rtsp: yes
rtspAddress: :8554

###############################################
# RTMP
rtmp: yes
rtmpAddress: :1935

###############################################
# HLS
hls: yes
hlsAddress: :8888
hlsVariant: mpegts
hlsAlwaysRemux: yes
hlsSegmentDuration: 1s
hlsSegmentCount: 3

###############################################
# WebRTC
webrtc: yes
webrtcAddress: :8889

# Tell MediaMTX its public hostname so ICE candidates are reachable from the internet.
webrtcICEHostNAT1To1IPs:
  - radio.cocopark.duckdns.org

# Mux all WebRTC UDP traffic on a single port so only one firewall rule is needed.
webrtcICEUDPMuxAddress: :8189

###############################################
# Paths

paths:
  deck-a:
    source: publisher
    sourceOnDemand: no
  deck-a-opus:
    source: rtsp://localhost:8554/deck-a
    sourceOnDemand: yes
  deck-b:
    source: publisher
    sourceOnDemand: no
  deck-b-opus:
    source: rtsp://localhost:8554/deck-b
    sourceOnDemand: yes
  deck-c:
    source: publisher
    sourceOnDemand: no
  deck-c-opus:
    source: rtsp://localhost:8554/deck-c
    sourceOnDemand: yes
  deck-d:
    source: publisher
    sourceOnDemand: no
  deck-d-opus:
    source: rtsp://localhost:8554/deck-d
    sourceOnDemand: yes
  deck-e:
    source: publisher
    sourceOnDemand: no
  deck-e-opus:
    source: rtsp://localhost:8554/deck-e
    sourceOnDemand: yes
  deck-f:
    source: publisher
    sourceOnDemand: no
  deck-f-opus:
    source: rtsp://localhost:8554/deck-f
    sourceOnDemand: yes

  # ── DJ Live Stream Paths ────────────────────────────────────────
  # OBS / browser → RTMP → dj-{a..f}  (one per zone-deck)
  # runOnPublishCmd  → notify API → fade out playlist → go LIVE
  # runOnUnpublishCmd→ notify API → fade in playlist  → AVAILABLE
  dj-a:
    source: publisher
    sourceOnDemand: no
    runOnPublishCmd: >-
      curl -sf -X POST http://api:8000/api/dj/stream/detected
      -H "Content-Type: application/json"
      -d "{\"deck\":\"a\",\"mediamtx_path\":\"dj-a\",\"stream_url\":\"rtmp://mediamtx:1935/dj-a\"}"
    runOnUnpublishCmd: >-
      curl -sf -X POST http://api:8000/api/dj/stream/ended
      -H "Content-Type: application/json"
      -d "{\"deck\":\"a\"}"
  dj-b:
    source: publisher
    sourceOnDemand: no
    runOnPublishCmd: >-
