version: '3.8'

# =============================================================================
# docker-compose.prod.yml — PRODUCTION
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml:
#   - Builds from local source (same repo, cloned on server)
#   - Named Docker volumes instead of bind-mount ./data/
#   - Port 8000 NOT exposed (API only reachable through nginx in dashboard)
#   - VITE URLs point to public domain
#   - CORS defaults to public domain
# =============================================================================

services:
  mediamtx:
    build: ./mediamtx
    container_name: cc_mediamtx
    restart: always
    ports:
      - "8554:8554"     # RTSP
      - "1935:1935"     # RTMP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC WHEP
      - "8189:8189/udp" # WebRTC ICE UDP
      - "9997:9997"     # MediaMTX API
    extra_hosts:
      - "api:10.20.0.4"
    networks:
      cocostation-net:
        ipv4_address: 10.20.0.2

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: always
    volumes:
      - cocostation-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      cocostation-net:
        ipv4_address: 10.20.0.7

  db:
    image: postgres:16-alpine
    container_name: cc_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coco_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cocostation}
    volumes:
      - cocostation-db-data:/var/lib/postgresql/data
    # Port 5432 NOT exposed in prod — DB only reachable by api container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coco} -d ${POSTGRES_DB:-cocostation}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      cocostation-net:
        ipv4_address: 10.20.0.3

  api:
    build: ./api
    container_name: cc_api
    restart: always
    # Port 8000 NOT exposed — accessed only through nginx inside the dashboard container
    environment:
      - TZ=Africa/Casablanca
      - DB_MODE=${DB_MODE:-local}
      - POSTGRES_USER=${POSTGRES_USER:-coco}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-coco_secret}
      - POSTGRES_DB=${POSTGRES_DB:-cocostation}
      - POSTGRES_HOST=10.20.0.3
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - FFMPEG_HOST=10.20.0.5
      - MEDIAMTX_HOST=10.20.0.2
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://10.20.0.7:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-https://radio.cocopark.duckdns.org}
      - WS_PING_INTERVAL=30
      - WS_PING_TIMEOUT=20
    volumes:
      - cocostation-library:/app/data/library
      - cocostation-announcements:/app/data/announcements
      - cocostation-chimes:/app/data/chimes
      - cocostation-branding:/app/data/branding
      - cocostation-recordings:/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      ffmpeg-mixer:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "db:10.20.0.3"
      - "ffmpeg-mixer:10.20.0.5"
      - "mediamtx:10.20.0.2"
      - "redis:10.20.0.7"
    networks:
      cocostation-net:
        ipv4_address: 10.20.0.4

  ffmpeg-mixer:
    build: ./ffmpeg-mixer
    container_name: cc_ffmpeg
    restart: always
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - cocostation-library:/library:ro
      - cocostation-announcements:/announcements:ro
      - cocostation-chimes:/chimes:ro
      - cocostation-recordings:/recordings
    environment:
      - TZ=Africa/Casablanca
      - MEDIAMTX_HOST=10.20.0.2
      - API_HOST=10.20.0.4
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "api:10.20.0.4"
      - "mediamtx:10.20.0.2"
    networks:
      cocostation-net:
        ipv4_address: 10.20.0.5

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://radio.cocopark.duckdns.org
        - VITE_WS_URL=wss://radio.cocopark.duckdns.org
        - VITE_SUPABASE_URL=${SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    container_name: cc_dashboard
    restart: always
    ports:
      - "8083:80"
    environment:
      - TZ=Africa/Casablanca
    depends_on:
      api:
        condition: service_healthy
    networks:
      cocostation-net:
        ipv4_address: 10.20.0.6

networks:
  cocostation-net:
    name: cocostation-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
          gateway: 10.20.0.1

volumes:
  cocostation-db-data:
    name: cocostation-db-data
  cocostation-library:
    name: cocostation-library
  cocostation-announcements:
    name: cocostation-announcements
  cocostation-chimes:
    name: cocostation-chimes
  cocostation-branding:
    name: cocostation-branding
  cocostation-redis-data:
    name: cocostation-redis-data
  cocostation-recordings:
    name: cocostation-recordings
