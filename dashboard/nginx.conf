# Shared cache zone for large, rarely-changing assets (logo etc.)
# 10m keys zone, 50m max size, items expire after 10 minutes of no access
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_assets:10m max_size=50m inactive=10m use_temp_path=off;

# Upstream definitions — nginx resolves these at startup and keeps connections alive
upstream api_backend {
    server api:8000;
    keepalive 8;          # maintain up to 8 idle connections to the API
}

upstream mediamtx_hls {
    server mediamtx:8888;
    keepalive 4;
}

upstream mediamtx_webrtc {
    server mediamtx:8889;
    keepalive 4;
}

server {
    listen 80;
    client_max_body_size 0;

    # Keep the nginx<->browser connection alive for 1 hour (covers long WS sessions)
    keepalive_timeout 3600s;

    # ── WebSocket — mic audio stream (more specific, must come before /ws) ──
    location /ws/mic {
        proxy_pass         http://api_backend/ws/mic;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;   # 24 h — mic session can run all day
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket — main state sync ──────────────────────────
    location /ws {
        proxy_pass         http://api_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;   # 24 h — never let nginx drop the WS connection
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
    }

    # ── Company logo — cache aggressively (large file, rarely changes) ────────
    # Strip the ?t= cache-buster before hitting the upstream so nginx can match
    # the same cache key regardless of the timestamp query param.
    location /api/settings/company/logo {
        proxy_pass         http://api_backend/api/settings/company/logo;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Use the named cache zone defined above
        proxy_cache        static_assets;
        proxy_cache_key    "$scheme$host$uri";   # ignore ?t= query param in cache key
        proxy_cache_valid  200 5m;
        proxy_cache_use_stale error timeout updating;
        add_header         Cache-Control "public, max-age=300, stale-while-revalidate=60";
        add_header         X-Cache-Status $upstream_cache_status;
        proxy_buffering    on;
        proxy_buffer_size  512k;
        proxy_buffers      8 512k;
    }

    # ── API REST ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;   # stream large audio uploads directly
        # Retry on upstream errors (e.g. API still booting)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
    }

    # ── WebRTC WHEP — must be before the generic HLS deck regex ──
    location ~ ^/(deck-[a-e])/whep$ {
        proxy_pass         http://mediamtx_webrtc;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
    }

    # ── HLS streams from MediaMTX ─────────────────────────────
    location ~ ^/(deck-[a-e])/ {
        proxy_pass         http://mediamtx_hls;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # ── MediaMTX internal API ─────────────────────────────────
    location /mediamtx-api/ {
        proxy_pass         http://mediamtx:9997/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Dashboard SPA — catch-all, must be last ───────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html index.htm;
        try_files  $uri $uri/ /index.html;
    }
}
